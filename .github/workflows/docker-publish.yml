name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Run Trivy vulnerability scanner (pushed image)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (PR image)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@45cbd0c69e560cd9e7cd7f8c32362050c9b7ded2 # v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          echo "## What's New in $TAG" > release-notes.md
          echo "" >> release-notes.md

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "### Initial Release" >> release-notes.md
            echo "" >> release-notes.md
            echo "A Dynamic DNS web service implementing the DynDNS v2 protocol with pluggable DNS backends:" >> release-notes.md
            echo "" >> release-notes.md
            echo "- **AWS Route53** — updates hosted zones via the AWS API (boto3)" >> release-notes.md
            echo "- **BIND nsupdate** — updates DNS via TSIG-authenticated dynamic updates (dnspython)" >> release-notes.md
            echo "- **Traefik** reverse proxy with automatic TLS via Let's Encrypt" >> release-notes.md
            echo "- Multi-platform Docker image (\`amd64\` + \`arm64\`)" >> release-notes.md
          else
            echo "### Changes since $PREVIOUS_TAG" >> release-notes.md
            echo "" >> release-notes.md
            git log --oneline --no-merges "$PREVIOUS_TAG..HEAD" | while read -r commit; do
              if [ -n "$commit" ]; then
                echo "- $commit" >> release-notes.md
              fi
            done
          fi

          # Docker image section
          echo "" >> release-notes.md
          echo "### Docker Image" >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "docker pull ghcr.io/${{ github.repository }}:${VERSION}" >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> release-notes.md

          # Usage section
          echo "" >> release-notes.md
          echo "### Quick Start" >> release-notes.md
          echo "" >> release-notes.md
          echo "Download [\`compose.example.yaml\`](https://github.com/${{ github.repository }}/blob/${TAG}/compose.example.yaml) and [\`.env.example\`](https://github.com/${{ github.repository }}/blob/${TAG}/.env.example), then:" >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "cp compose.example.yaml compose.yaml" >> release-notes.md
          echo "cp .env.example .env" >> release-notes.md
          echo "# Edit .env with your credentials and domain settings" >> release-notes.md
          echo "docker compose up -d" >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "See [INSTALLING.md](https://github.com/${{ github.repository }}/blob/${TAG}/INSTALLING.md) for full configuration and usage." >> release-notes.md

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          body_path: release-notes.md
