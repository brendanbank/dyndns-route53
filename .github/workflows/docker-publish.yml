name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Run Trivy vulnerability scanner (pushed image)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (PR image)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          echo "## What's New in $TAG" > release-notes.md
          echo "" >> release-notes.md

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "### Initial Release" >> release-notes.md
            echo "" >> release-notes.md
            echo "A Dynamic DNS web service implementing the DynDNS v2 protocol with pluggable DNS backends:" >> release-notes.md
            echo "" >> release-notes.md
            echo "- **AWS Route53** — updates hosted zones via the AWS API (boto3)" >> release-notes.md
            echo "- **BIND nsupdate** — updates DNS via TSIG-authenticated dynamic updates (dnspython)" >> release-notes.md
            echo "- **Traefik** reverse proxy with automatic TLS via Let's Encrypt" >> release-notes.md
            echo "- Multi-platform Docker image (\`amd64\` + \`arm64\`)" >> release-notes.md
          else
            echo "### Changes since $PREVIOUS_TAG" >> release-notes.md
            echo "" >> release-notes.md
            git log --oneline --no-merges "$PREVIOUS_TAG..HEAD" | while read -r commit; do
              if [ -n "$commit" ]; then
                echo "- $commit" >> release-notes.md
              fi
            done
          fi

          # Docker image section
          echo "" >> release-notes.md
          echo "### Docker Image" >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "docker pull ghcr.io/${{ github.repository }}:${VERSION}" >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> release-notes.md

          # Usage section
          echo "" >> release-notes.md
          echo "### Quick Start" >> release-notes.md
          echo "" >> release-notes.md
          echo "Download [\`compose.example.yaml\`](https://github.com/${{ github.repository }}/blob/${TAG}/compose.example.yaml) and [\`.env.example\`](https://github.com/${{ github.repository }}/blob/${TAG}/.env.example), then:" >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "cp compose.example.yaml compose.yaml" >> release-notes.md
          echo "cp .env.example .env" >> release-notes.md
          echo "# Edit .env — set SECRET_KEY, FERNET_KEY, ADMIN_PASSWORD, and domain settings" >> release-notes.md
          echo "docker compose up -d" >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "See [INSTALLING.md](https://github.com/${{ github.repository }}/blob/${TAG}/INSTALLING.md) for full configuration and usage." >> release-notes.md

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          body_path: release-notes.md
