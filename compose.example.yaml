# Example Docker Compose file for dyndns-route53
#
# Usage:
#   1. Copy this file:        cp compose.example.yaml compose.yaml
#   2. Create your env file:  cp .env.example .env
#   3. Edit .env with your SECRET_KEY, FERNET_KEY, and ADMIN_PASSWORD
#   4. Start the service:     docker compose up -d
#   5. Log in at https://${TRAEFIK_HOSTNAME}/admin/login
#
# Traefik handles TLS automatically via Let's Encrypt.
# HTTP (port 80) redirects to HTTPS (port 443).
#
# Test with curl:
#   curl -k -u ${USERNAME}:${PASSWORD} "https://${TRAEFIK_HOSTNAME}:${HTTPS_PORT}/nic/update?hostname=test.dyn.example.com&myip=203.0.113.1"

services:
  traefik:
    image: traefik:v3.3
    network_mode: host
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:${HTTP_PORT:-80}"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:${HTTPS_PORT:-443}"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  web:
    image: ghcr.io/brendanbank/dyndns-route53:latest
    expose:
      - 80
    env_file:
      - .env
    volumes:
      - dyndns-data:/app/instance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dyndns.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.dyndns.entrypoints=websecure"
      - "traefik.http.routers.dyndns.tls.certresolver=letsencrypt"
      - "traefik.http.services.dyndns.loadbalancer.server.port=80"
    restart: always

volumes:
  letsencrypt:
  dyndns-data:
