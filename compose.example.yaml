# Example Docker Compose file for dyndns-route53
#
# Usage:
#   1. Copy this file:        cp compose.example.yaml compose.yaml
#   2. Create your env file:  cp .env.example .env
#   3. Edit .env with your credentials and domain settings
#   4. Generate a password:   docker run --rm ghcr.io/brendanbank/dyndns-route53:latest python3 /app/getpwd.py
#   5. Start the service:     docker compose up -d
#
# Traefik handles TLS automatically via Let's Encrypt.
# HTTP (port 80) redirects to HTTPS (port 443).
#
# Test with curl:
#   curl -k -u ${USERNAME}:${PASSWORD_CT} "https://${TRAEFIK_HOSTNAME}:${HTTPS_PORT}/nic/update?hostname=${HOSTNAME}&myip=${MYIP}"
#
# Test with wget:
#   wget -O - --no-check-certificate --auth-no-challenge --user=${USERNAME} --password=${PASSWORD_CT} "https://${TRAEFIK_HOSTNAME}:${HTTPS_PORT}/nic/update?hostname=${HOSTNAME}&myip=${MYIP}"

services:
  traefik:
    image: traefik:v3.3
    network_mode: host
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:${HTTP_PORT:-80}"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:${HTTPS_PORT:-443}"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_HOSTED_ZONE_ID=${ZONEID}
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  web:
    image: ghcr.io/brendanbank/dyndns-route53:latest
    expose:
      - 80
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dyndns.rule=Host(`${TRAEFIK_HOSTNAME}`) || Host(`${TRAEFIK_HOSTNAME2}`)"
      - "traefik.http.routers.dyndns.entrypoints=websecure"
      - "traefik.http.routers.dyndns.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dyndns.tls.domains[0].main=${TRAEFIK_HOSTNAME}"
      - "traefik.http.routers.dyndns.tls.domains[0].sans=${TRAEFIK_HOSTNAME2}"
      - "traefik.http.services.dyndns.loadbalancer.server.port=80"
    restart: always

volumes:
  letsencrypt:
