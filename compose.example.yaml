# Example Docker Compose file for dyndns-route53
#
# Usage:
#   1. Copy this file:        cp compose.example.yaml compose.yaml
#   2. Create your env file:  cp .env.example .env
#   3. Edit .env with your SECRET_KEY, FERNET_KEY, and ADMIN_PASSWORD
#   4. Start the service:     docker compose up -d
#   5. Log in at https://${TRAEFIK_HOSTNAME}/admin/login
#
# Traefik handles TLS automatically via Let's Encrypt.
# HTTP (port 80) redirects to HTTPS (port 443).
#
# Important: To preserve real client IPs, disable Docker's userland-proxy:
#   echo '{"userland-proxy": false}' | sudo tee /etc/docker/daemon.json
#   sudo systemctl restart docker
#
# Test with curl:
#   curl -k -u ${USERNAME}:${PASSWORD} "https://${TRAEFIK_HOSTNAME}:${HTTPS_PORT}/nic/update?hostname=test.dyn.example.com&myip=203.0.113.1"

services:
  traefik:
    image: traefik:v3.3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--accesslog.format=json"
      # Dropped because RequestPath includes the query string, and this service
      # accepts ?username=&password= auth. Remove this line only if you never
      # use query-param auth and want paths in your access log.
      # Keep the path and the query parameter names, but redact every value, so
      # ?password= auth can never land in the log. Requires Traefik >= 3.6.
      # Use =drop instead to remove the query string entirely.
      - "--accesslog.fields.queryparameters.defaultmode=redact"
      # Request headers default to drop, so User-Agent must be kept by name.
      - "--accesslog.fields.headers.names.User-Agent=keep"
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web-network
    restart: always

  web:
    image: ghcr.io/brendanbank/dyndns-route53:latest
    expose:
      - 80
    env_file:
      - .env
    volumes:
      - dyndns-data:/app/instance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dyndns.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.dyndns.entrypoints=websecure"
      - "traefik.http.routers.dyndns.tls.certresolver=letsencrypt"
      - "traefik.http.services.dyndns.loadbalancer.server.port=80"
      - "traefik.docker.network=web-network"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web-network
    restart: always

networks:
  web-network:
    driver: bridge
    enable_ipv6: true

volumes:
  letsencrypt:
  dyndns-data:
