services:
  traefik:
    image: traefik:v3.3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CASERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "loki"
      options:
        loki-external-labels: "platform=docker"
        loki-url: "http://loki.bgwlan.nl:3100/loki/api/v1/push"
        loki-pipeline-stages: |
          - multiline:
              firstline: '^Traceback \(most recent call last\):'
              max_wait_time: 3s
              max_lines: 128
          - json:
              expressions:
                stream: stream
                attrs: attrs
                tag: attrs.tag
                level: attrs.level
                msg: log
        loki-relabel-config: |
          - action: replace
            source_labels: ['__filename__']
            target_label: 'job'
          - action: replace
            source_labels: ['container_name']
            target_label: 'container'
          - action: replace
            source_labels: ['stream']
            target_label: 'stream'



  web:
    image: ghcr.io/brendanbank/dyndns-route53:latest
    build: .
    expose:
      - 80
    env_file:
      - .env
    volumes:
      - dyndns-data:/app/instance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dyndns.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.dyndns.entrypoints=websecure"
      - "traefik.http.routers.dyndns.tls.certresolver=letsencrypt"
      - "traefik.http.services.dyndns.loadbalancer.server.port=80"
      - "traefik.docker.network=web-network"
    networks:
      - web-network
    restart: always
    logging:
      driver: "loki"
      options:
        loki-external-labels: "platform=docker"
        loki-url: "http://loki.bgwlan.nl:3100/loki/api/v1/push"
        loki-pipeline-stages: |
          - multiline:
              firstline: '^Traceback \(most recent call last\):'
              max_wait_time: 3s
              max_lines: 128
          - json:
              expressions:
                stream: stream
                attrs: attrs
                tag: attrs.tag
                level: attrs.level
                msg: log
        loki-relabel-config: |
          - action: replace
            source_labels: ['__filename__']
            target_label: 'job'
          - action: replace
            source_labels: ['container_name']
            target_label: 'container'
          - action: replace
            source_labels: ['stream']
            target_label: 'stream'


networks:
  web-network:
    driver: bridge
    enable_ipv6: true

volumes:
  dyndns-data:
