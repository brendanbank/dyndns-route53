services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CASERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--accesslog.format=json"
      # Traefik is the ONLY place a request path is logged: gunicorn's access
      # log is disabled and the app logs no URLs.
      #
      # The FULL URL is logged, query string included, so path-keyed analysis
      # can cover this edge.
      #
      # This is only safe while every client authenticates with HTTP Basic Auth.
      # The app still ACCEPTS ?username=&password= as a discouraged fallback,
      # and anything sent that way is written here in clear text. The app logs a
      # warning whenever it happens, so this must stay at zero:
      #   {app="dyndns",container="dyndns-route53-web-1"}
      #     |= `credentials passed via query parameters`
      # If it is ever non-zero, set this back to `drop` and fix the client.
      #
      # Use ONLY keep or drop. `redact` is accepted by the flag parser and
      # Traefik starts cleanly, but behaves as keep -- an invalid mode falls
      # through checkFieldValue's default branch to defaultKeep=true, and
      # logger.go then copies req.URL.RawQuery whole. It fails OPEN.
      #
      # Per-parameter filtering (queryparameters.names.<param>) does NOT exist
      # in any release as of 3.7.9; both 3.6.24 and 3.7.9 reject it as "field
      # not found". FieldQueryParameters has a DefaultMode and no Names map.
      - "--accesslog.fields.queryparameters.defaultmode=keep"
      # Request headers default to drop, so User-Agent must be kept by name.
      # Needed by the synthetic-monitoring exclusion in the anomalies pipeline:
      # a rule filtering on a field the edge never logs does not error, it just
      # never excludes anything. See Brendan-Bank/banzai-anomalies#94.
      - "--accesslog.fields.headers.names.User-Agent=keep"
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    networks:
      - web-network
    # Log shipping (Loki etc.) is deliberately NOT configured here -- it is
    # site-specific and this is a public repo. Put it in a local, gitignored
    # docker-compose.override.yml; see docker-compose.override.yml.example.
    # Credentials cannot reach these logs -- the query string is stripped above
    # at the producer -- so no downstream redaction stage is needed or trusted.

  web:
    image: ghcr.io/brendanbank/dyndns-route53:latest
    build: .
    expose:
      - 80
    env_file:
      - .env
    volumes:
      - dyndns-data:/app/instance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dyndns.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.dyndns.entrypoints=websecure"
      - "traefik.http.routers.dyndns.tls.certresolver=letsencrypt"
      - "traefik.http.services.dyndns.loadbalancer.server.port=80"
      - "traefik.docker.network=web-network"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - web-network
    restart: always
    # Log shipping is site-specific -- see the note on the traefik service and
    # docker-compose.override.yml.example.

networks:
  web-network:
    driver: bridge
    enable_ipv6: true

volumes:
  dyndns-data:
