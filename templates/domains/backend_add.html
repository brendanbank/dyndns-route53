{% extends "base.html" %}
{% block title %}Add Backend to {{ domain.name }} - DynDNS Admin{% endblock %}
{% block content %}
<h2>Add Backend to {{ domain.name }}</h2>
<div class="row">
    <div class="col-md-6">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="backend_type" class="form-label">Backend Type</label>
                <select class="form-select" id="backend_type" name="backend_type">
                    {% for bt in backend_types %}
                    <option value="{{ bt }}">{{ bt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Add</button>
                <a href="{{ url_for('web.domain_edit', domain_id=domain.id) }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
